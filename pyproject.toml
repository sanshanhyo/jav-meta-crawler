[project]
name = "jav-meta-crawler"
version = "0.1.0"
description = "A Python crawler for querying public JAV metadata from multiple sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "curl-cffi>=0.7.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
]

[project.scripts]
jav-meta = "javlibrary_crawler.cli:main"
javlibrary = "javlibrary_crawler.cli:main"
javv = "javlibrary_crawler.cli:main"

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0",
]
test = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["javlibrary_crawler"]
exclude = ["tests", "config", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
